<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Dark Blur Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </radialGradient>

    <!-- Glassmorphism Card Backdrop -->
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.03" />
    </linearGradient>

    <!-- Glass Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05" />
    </linearGradient>

    <!-- Icon Core Glow -->
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <!-- Soft Drop Shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Canvas Base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Glass Card Container -->
  <rect x="64" y="64" width="384" height="384" rx="80" 
        fill="url(#glassGrad)" 
        stroke="url(#borderGrad)" 
        stroke-width="3" 
        filter="url(#shadow)" />

  <!-- Ambient Inner Light Arc (matching bottom-right dashboard motif) -->
  <path d="M 120 384 A 180 180 0 0 1 384 120" 
        fill="none" 
        stroke="#ffffff" 
        stroke-opacity="0.08" 
        stroke-width="32" 
        stroke-linecap="round" />

  <!-- Daymark Beacon Symbol -->
  <g transform="translate(256, 256)">
    <!-- Outer Pulsing Glow Circle -->
    <circle cx="0" cy="0" r="88" fill="none" stroke="#93c5fd" stroke-opacity="0.25" stroke-width="6" stroke-dasharray="12 8" />
    
    <!-- Location Pin Beacon Outer Rim -->
    <path d="M 0 -72 C -39.76 -72 -72 -39.76 -72 0 C -72 54 0 96 0 96 C 0 96 72 54 72 0 C 72 -39.76 39.76 -72 0 -72 Z" 
          fill="url(#glowGrad)" />

    <!-- Center Cutout / Sun Dot -->
    <circle cx="0" cy="-12" r="28" fill="#0b1120" />
    <circle cx="0" cy="-12" r="14" fill="#ffffff" />
  </g>
</svg>
